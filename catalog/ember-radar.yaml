# Copy this file to plugin-catalog/ember-radar.yaml in NousResearch/hermes-agent and open the PR.
# Replace <OWNER> with the GitHub user/org that hosts the ember-radar repo and <SHA> with the full
# 40-character commit you are submitting (git rev-parse HEAD).
name: ember-radar
title: Ember Radar
repo: https://github.com/<OWNER>/ember-radar
sha: <SHA>
version: "0.1.0"
description: "Ember, the Solana launchpad where every coin is paired with a tokenized stock or a blue chip and its fees go to holders, burns, a lotto or a trader, inside Hermes: ten read-only tools (discover coins, a coin's whole card, holders, trades, fee payouts, the live tape, the fomode traders board, the stock pairs), a per-profile watchlist whose notable moves Hermes whispers at the start of a turn, /ember in any session, an Ember daily-brief Automation Blueprint and two research skills. No keys, no wallet: HTTPS reads of embercurve.fun's public API, the watchlist in the plugin's own data dir."
maintainer: <OWNER>
tier: community
category: tools
requires_hermes: ">=0.22.6"
docs_url: https://github.com/<OWNER>/ember-radar#readme
image: https://raw.githubusercontent.com/<OWNER>/ember-radar/<SHA>/docs/banner.png
screenshots:
  - https://raw.githubusercontent.com/<OWNER>/ember-radar/<SHA>/docs/ember-top.png
  - https://raw.githubusercontent.com/<OWNER>/ember-radar/<SHA>/docs/ember-card.png
  - https://raw.githubusercontent.com/<OWNER>/ember-radar/<SHA>/docs/ember-tool.png
readme: true
platforms: []
capabilities:
  provides_tools:
    - ember_markets
    - ember_coin
    - ember_holders
    - ember_trades
    - ember_fees
    - ember_feed
    - ember_fomo_board
    - ember_pairs
    - ember_watch
    - ember_pulse
  provides_hooks:
    - pre_llm_call
  provides_middleware: []
  requires_env: []
